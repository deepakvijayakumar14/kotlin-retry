name: Release

# Publishing to Maven Central is irreversible: a released version can never be changed or
# removed. The default publishingType therefore stops at validation and waits for approval in
# the Central Portal UI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publishingType:
        description: 'USER_MANAGED = validate, then approve in the Portal. AUTOMATIC = publish immediately (irreversible).'
        required: true
        default: USER_MANAGED
        type: choice
        options: [USER_MANAGED, AUTOMATIC]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Check required secrets are present
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$CENTRAL_USERNAME" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$CENTRAL_PASSWORD" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$GPG_PRIVATE_KEY" ]  || missing="$missing GPG_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      # A tag that disagrees with build.gradle.kts would publish the wrong coordinates, and
      # Central will not let you take them back.
      - name: Verify the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(./gradlew -q printVersion)"
          echo "tag=$tag_version project=$project_version"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag_version but build.gradle.kts declares $project_version"
            exit 1
          fi

      - name: Refuse to publish a SNAPSHOT
        run: |
          version="$(./gradlew -q printVersion)"
          case "$version" in
            *-SNAPSHOT) echo "::error::Central does not accept SNAPSHOT versions ($version)"; exit 1 ;;
          esac

      - name: Build, test and lint
        run: ./gradlew build --no-daemon

      - name: Stage signed artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishAllPublicationsToStagingRepository --no-daemon

      - name: Assemble the Central bundle
        run: |
          cd build/staging-deploy
          # Central generates its own maven-metadata; shipping ours fails validation.
          find . -name 'maven-metadata.xml*' -delete
          # Every artifact needs a detached signature - fail loudly rather than at the Portal.
          for f in $(find . -type f ! -name '*.asc' ! -name '*.md5' ! -name '*.sha1' \
                                        ! -name '*.sha256' ! -name '*.sha512'); do
            [ -f "$f.asc" ] || { echo "::error::Unsigned artifact: $f"; exit 1; }
          done
          zip -q -r ../central-bundle.zip .
          echo "Bundle contents:"
          unzip -l ../central-bundle.zip

      - name: Upload to the Central Portal
        id: upload
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PUBLISHING_TYPE: ${{ github.event.inputs.publishingType || 'USER_MANAGED' }}
        run: |
          auth="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          response="$(mktemp)"
          status="$(curl -sS -o "$response" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $auth" \
            -F "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=${PUBLISHING_TYPE}&name=${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}")"
          body="$(cat "$response")"
          if [ "$status" != "201" ]; then
            echo "::error::Upload failed with HTTP $status: $body"
            exit 1
          fi
          echo "deployment-id=$body" >> "$GITHUB_OUTPUT"
          echo "Deployment $body created as $PUBLISHING_TYPE"

      - name: Wait for validation
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment-id }}
        run: |
          auth="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          for attempt in $(seq 1 60); do
            body="$(curl -sS -X POST -H "Authorization: Bearer $auth" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")"
            state="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState","UNKNOWN"))')"
            echo "attempt $attempt: $state"
            case "$state" in
              PUBLISHED)
                echo "::notice::Published to Maven Central."; exit 0 ;;
              VALIDATED)
                echo "::notice::Validated. Approve the deployment at https://central.sonatype.com/publishing/deployments to release it."
                exit 0 ;;
              FAILED)
                echo "::error::Deployment failed: $body"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out after 10 minutes waiting on deployment $DEPLOYMENT_ID"
          exit 1
